<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" role="img" aria-labelledby="title desc">
  <title id="title">Match Fix</title>
  <desc id="desc">Two crossed matchsticks forming an X beside the Match Fix wordmark.</desc>
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c27b"/>
      <stop offset="1" stop-color="#c98a43"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#3b2517" flood-opacity=".16"/>
    </filter>
  </defs>
  <g transform="translate(16 18)" filter="url(#shadow)">
    <rect x="55" y="5" width="18" height="118" rx="9" fill="url(#wood)" transform="rotate(42 64 64)"/>
    <circle cx="27" cy="24" r="13" fill="#c84735"/>
    <rect x="55" y="5" width="18" height="118" rx="9" fill="url(#wood)" transform="rotate(-42 64 64)"/>
    <circle cx="101" cy="24" r="13" fill="#c84735"/>
    <circle cx="64" cy="64" r="8" fill="#fff7e7" stroke="#9d6736" stroke-width="4"/>
  </g>
  <g fill="#201c18">
    <text x="150" y="76" font-family="Inter, Arial, sans-serif" font-size="60" font-weight="900" letter-spacing="-3">Match</text>
    <text x="150" y="132" font-family="Inter, Arial, sans-serif" font-size="60" font-weight="900" letter-spacing="-3">Fix</text>
  </g>
  <circle cx="470" cy="112" r="10" fill="#c84735"/>
  <rect x="455" y="50" width="16" height="60" rx="8" fill="#dda25c" transform="rotate(22 463 80)"/>
</svg>
