<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Match Fix mark</title>
  <desc id="desc">Two polished wooden matchsticks crossed to form an X.</desc>
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe1a1"/>
      <stop offset="0.38" stop-color="#eeb05f"/>
      <stop offset="0.7" stop-color="#cf7f35"/>
      <stop offset="1" stop-color="#9a5528"/>
    </linearGradient>
    <linearGradient id="woodHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4cf" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#fff4cf" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff4cf" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="head" cx="35%" cy="25%" r="80%">
      <stop offset="0" stop-color="#ff8064"/>
      <stop offset=".42" stop-color="#eb5c43"/>
      <stop offset="1" stop-color="#a92f28"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#2b160c" flood-opacity=".28"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <g transform="rotate(43 64 64)">
      <rect x="56" y="20" width="16" height="96" rx="8" fill="url(#wood)" stroke="#c97a35" stroke-width="1.6"/>
      <rect x="59" y="27" width="4" height="77" rx="2" fill="url(#woodHi)"/>
      <ellipse cx="64" cy="19" rx="12.5" ry="15" fill="url(#head)" stroke="#a82e27" stroke-width="1.4"/>
      <ellipse cx="59.5" cy="14.5" rx="3.3" ry="4.6" fill="#ffb29f" opacity=".48"/>
    </g>
    <g transform="rotate(-43 64 64)">
      <rect x="56" y="20" width="16" height="96" rx="8" fill="url(#wood)" stroke="#c97a35" stroke-width="1.6"/>
      <rect x="59" y="27" width="4" height="77" rx="2" fill="url(#woodHi)"/>
      <ellipse cx="64" cy="19" rx="12.5" ry="15" fill="url(#head)" stroke="#a82e27" stroke-width="1.4"/>
      <ellipse cx="59.5" cy="14.5" rx="3.3" ry="4.6" fill="#ffb29f" opacity=".48"/>
    </g>
    <circle cx="64" cy="64" r="7.4" fill="#f7bf5e" stroke="#7c421f" stroke-width="3"/>
    <circle cx="62" cy="61.5" r="2.3" fill="#fff0b3" opacity=".9"/>
  </g>
</svg>
