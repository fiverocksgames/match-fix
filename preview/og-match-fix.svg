<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Match Fix</title>
  <desc id="desc">Match Fix social preview with matchstick puzzle branding.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6efe1"/>
      <stop offset="1" stop-color="#eadfc9"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2c982"/>
      <stop offset="1" stop-color="#c9853e"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#49301d" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="110" r="180" fill="#e55b42" opacity=".08"/>
  <circle cx="104" cy="548" r="230" fill="#cf9b56" opacity=".10"/>
  <g transform="translate(120 125) scale(2.55)" filter="url(#shadow)">
    <rect x="55" y="5" width="18" height="118" rx="9" fill="url(#wood)" transform="rotate(42 64 64)"/>
    <circle cx="27" cy="24" r="13" fill="#c84735"/>
    <rect x="55" y="5" width="18" height="118" rx="9" fill="url(#wood)" transform="rotate(-42 64 64)"/>
    <circle cx="101" cy="24" r="13" fill="#c84735"/>
    <circle cx="64" cy="64" r="8" fill="#fff7e7" stroke="#9d6736" stroke-width="4"/>
  </g>
  <g fill="#201c18" font-family="Inter, Arial, sans-serif">
    <text x="500" y="278" font-size="118" font-weight="900" letter-spacing="-7">Match Fix</text>
    <text x="508" y="352" font-size="36" font-weight="800">MOVE THE MATCH. FIX THE EQUATION.</text>
    <text x="508" y="416" font-size="31" font-weight="650" fill="#685b4d">성냥을 정확히 옮겨 틀린 식을 고쳐보세요.</text>
  </g>
  <g transform="translate(510 474)">
    <rect width="460" height="72" rx="36" fill="#201c18"/>
    <text x="230" y="47" text-anchor="middle" fill="#fffaf0" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="800">Five Rocks Games</text>
  </g>
</svg>
